workflows:
  ios-testflight:
    name: Abuelitos Peru - TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Abuelitos"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pe.abuelitos.app
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.abuelitos.app"
    scripts:
      - name: Instalar dependencias
        script: |
          npm install
      - name: Prebuild nativo iOS (Expo)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Configurar perfiles y Compilar IPA para iOS
        script: |
          # 1. Detectar automáticamente el Workspace y Proyecto real generado por Expo
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          
          echo "==========================================="
          echo "✅ Workspace detectado: $WORKSPACE"
          echo "✅ Proyecto detectado: $PROJECT"
          echo "✅ Scheme detectado: $SCHEME"
          echo "==========================================="
          
          # 2. Inyectar perfiles oficiales de Apple
          xcode-project use-profiles --project "$PROJECT"
          
          # 3. Compilar el archivo .IPA para TestFlight
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true