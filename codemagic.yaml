workflows:
  ios-testflight:
    name: Abuelitos Peru - TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Abuelitos"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pe.abuelitos.app
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.abuelitos.app"
    scripts:
      - name: Instalar dependencias
        script: |
          npm install
      - name: Prebuild nativo iOS (Expo)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Inyectar perfiles en Xcode
        script: |
          xcode-project use-profiles --project ios/frontendabuelitos.xcodeproj
      - name: Compilar IPA para iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/frontendabuelitos.xcworkspace \
            --scheme frontendabuelitos
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true