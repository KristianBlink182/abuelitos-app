workflows:
  ios-testflight:
    name: Abuelitos Peru - TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Abuelitos"
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.abuelitos.app"
    scripts:
      - name: Instalar dependencias
        script: |
          npm install
      - name: Prebuild nativo iOS (Expo)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Configurar perfiles de Apple
        script: |
          xcode-project use-profiles
      - name: Compilar IPA para iOS
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcode-project list-schemes --workspace "$WORKSPACE" | head -n 1)
          echo "Compilando Workspace: $WORKSPACE con Scheme: $SCHEME"
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true