workflows:
  ios-testflight:
    name: Abuelitos Peru - TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Abuelitos"
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.abuelitos.app"
    scripts:
      - name: Instalar dependencias
        script: |
          npm install
      - name: Prebuild nativo iOS (Expo)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Configurar llavero y certificados de Apple
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Compilar IPA para iOS
        script: |
          xcode-project build-ipa \
            --workspace ios/frontendabuelitos.xcworkspace \
            --scheme frontendabuelitos
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true