workflows:
  ios-testflight:
    name: Abuelitos Peru - TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Codemagic Abuelitos"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pe.abuelitos.app
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "pe.abuelitos.app"
    scripts:
      - name: Instalar dependencias
        script: |
          npm install
      - name: Prebuild nativo iOS (Expo)
        script: |
          npx expo prebuild --platform ios --clean
      - name: Instalar CocoaPods
        script: |
          cd ios && pod install
      - name: Forzar nuevo numero de version para Apple
        script: |
          # Incrementa el numero de version a 10 para superar cualquier version anterior
          find ios -name "Info.plist" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(($BUILD_NUMBER + 5))" {} \;
          find ios -name "Info.plist" -exec /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.1" {} \;
      - name: Inyectar perfiles oficiales de Apple
        script: |
          PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          xcode-project use-profiles --project "$PROJECT"
      - name: Compilar IPA para iOS
        script: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename $(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1) .xcodeproj)
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true